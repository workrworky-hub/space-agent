    <!-- Lument premium boot shell: instant-paint, gradient, refined splash -->
    <style>
      :root {
        color-scheme: dark;
        --lument-ink: #05060c;
        --lument-ink-2: #0a0d18;
        --lument-glow-1: rgba(122, 162, 255, 0.10);
        --lument-glow-2: rgba(121, 237, 216, 0.07);
        --lument-glow-3: rgba(180, 130, 255, 0.06);
        --lument-accent: #c8b88a;
      }
      html, body { margin: 0; padding: 0; background: var(--lument-ink); }
      body { min-height: 100vh; }
      /* Premium ambient gradient layer painted directly on the html root, behind everything,
         so it appears on the first frame and survives even before space-canvas.css loads. */
      html::before {
        content: "";
        position: fixed; inset: 0; z-index: -10; pointer-events: none;
        background:
          radial-gradient(900px 600px at 12% 8%,  var(--lument-glow-1) 0%, transparent 60%),
          radial-gradient(800px 700px at 88% 18%, var(--lument-glow-2) 0%, transparent 60%),
          radial-gradient(1200px 900px at 50% 110%, var(--lument-glow-3) 0%, transparent 65%),
          linear-gradient(180deg, var(--lument-ink-2) 0%, var(--lument-ink) 60%, #03040a 100%);
      }
      /* Subtle film grain for tactile premium feel; cheap CSS-only, no images. */
      html::after {
        content: "";
        position: fixed; inset: 0; z-index: -9; pointer-events: none;
        opacity: .035;
        background-image:
          radial-gradient(rgba(255,255,255,.7) 1px, transparent 1px),
          radial-gradient(rgba(255,255,255,.5) 1px, transparent 1px);
        background-size: 3px 3px, 5px 5px;
        background-position: 0 0, 1px 2px;
        mix-blend-mode: overlay;
      }
      #space-boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: transparent; z-index: 2147483647; pointer-events: none;
        transition: opacity .15s ease;
      }
      #space-boot.is-hidden { opacity: 0; }
      #space-boot::before {
        content: "Lument";
        position: absolute; top: calc(50% + 38px); left: 50%; transform: translateX(-50%);
        font: 500 12px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.45em; text-transform: uppercase;
        color: rgba(245, 240, 220, 0.55);
      }
      #space-boot::after {
        content: ""; width: 30px; height: 30px; border-radius: 50%;
        border: 1.5px solid rgba(200, 184, 138, 0.18);
        border-top-color: rgba(200, 184, 138, 0.85);
        animation: lument-boot-spin 1.05s cubic-bezier(.4,.15,.3,1) infinite;
      }
      @keyframes lument-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #space-boot::after { animation: none; }
        #space-boot { transition: none; }
      }
    </style>

  <body class="app-page-router space-theme-canvas">
    <div id="space-boot" aria-hidden="true"></div>
    <x-extension id="body/start"></x-extension>
    <script>
      // Hide the boot splash as soon as real content paints. Aggressive removal
      // so cached navigations feel instant — short fade, immediate DOM removal.
      (function () {
        var boot = document.getElementById("space-boot");
        if (!boot) return;
        var removed = false;
        var hide = function () {
          if (removed) return;
          removed = true;
          boot.classList.add("is-hidden");
          // Remove from DOM right away so it stops costing layout/paint;
          // the opacity transition on the class still runs visually for ~150ms.
          requestAnimationFrame(function () { boot.remove(); });
        };
        var ext = document.querySelector('x-extension[id="body/start"]');
        if (ext && "MutationObserver" in window) {
          var obs = new MutationObserver(function () {
            if (ext.childElementCount > 0 || ext.shadowRoot) {
              obs.disconnect();
              hide();
            }
          });
          obs.observe(ext, { childList: true, subtree: false });
        }
        // Tighter fallbacks: don't hold the splash longer than needed.
        window.addEventListener("DOMContentLoaded", function () { setTimeout(hide, 250); });
        window.addEventListener("load", function () { hide(); });
        setTimeout(hide, 2500);
      })();
    </script>
